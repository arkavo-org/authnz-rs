[package]
name = "authnz-rs"
version = "0.7.0"
edition = "2024"
license = "BSD-2"
rust-version = "1.95"  # raised from 1.91.1 for didwebvh-rs 0.5.5 (webvh feature)
# Adding src/bin/seed-test-user.rs makes `cargo run` ambiguous without this.
default-run = "authnz-rs"

[profile.release]
opt-level = 2  # Lower optimization level
lto = false    # Disable LTO
codegen-units = 16  # Increase parallelism

[dependencies]
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "macros", "fs", "net", "io-util"] }
axum = { version = "0.7", features = ["http2", "tokio"] }
fred = { version = "9.0" }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
# HTTP/3 support (optional - enable with "http3" feature)
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11", optional = true }
http-body = { version = "1", optional = true }         # response body size_hint for H3 Content-Length
http-body-util = { version = "0.1", optional = true }  # frame-by-frame H3 response streaming
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
tower = { version = "0.5", features = ["full"] }
tower-sessions = "0.12"
thiserror = "2.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
pem = "3.0"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["der", "signing", "std", "verifying"] }
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
chrono = "0.4"
form_urlencoded = "1.2"
http = "1.3"
aws-config = "1.8"
aws-sdk-dynamodb = "1.98"
aws-sdk-kms = "1.98"
bytes = "1.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"
# Security-critical dependencies - versions locked for audit trail
ciborium = "=0.2.2"      # CBOR parsing for attestation objects
coset = "0.3"            # COSE_Sign1 + COSE_Key primitives for CWT
x509-parser = "=0.16.0"  # Certificate chain validation
base64 = "=0.22.1"       # Encoding/decoding for attestation data
hex = "=0.4.3"           # Hex encoding for hashes
aes-gcm = "0.10"         # AES-256-GCM for sealing Patreon tokens under KMS-wrapped DEK

# Agent delegation: did:key (Ed25519 multicodec, base58btc) parsing + proof verification
ed25519-dalek = "2"
bs58 = "0.5"
getrandom = "0.2"

# did:webvh log engine (opt-in via the `webvh` feature) — DIF reference impl.
# Heavy transitive tree, so gated to keep the default build lean. Needs the MSRV
# bump to 1.95 (rust-version above). The Ed25519 update key is loaded via the
# crate's re-exported `Secret`, so no other direct dep is required.
didwebvh-rs = { version = "0.5.5", default-features = false, optional = true }

[features]
default = []
http3 = ["h3", "h3-quinn", "quinn", "http-body", "http-body-util"]
# did:webvh log engine (DIF didwebvh-rs). Heavy deps, so opt-in.
webvh = ["dep:didwebvh-rs"]
