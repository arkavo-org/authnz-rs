name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Test
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo test --verbose
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        target:
          [
            #            aarch64-unknown-linux-gnu,
            x86_64-unknown-linux-gnu,
          ]
        include:
          #          - os: ubuntu-latest
          #            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies on Linux
        run: |
          sudo apt-get update
          sudo apt-get install gcc-aarch64-linux-gnu
      - name: Install Rust and Build
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/authnz-rs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: target/${{ matrix.target }}/release/authnz-rs
  agent-flow:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      AGENT_TOKEN_AUDIENCES: https://platform.test
      AGENT_AUTHORIZED_ACTORS: https://kg.test
      OIDC_ISSUER: http://127.0.0.1:8080
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install awscli && bash scripts/dynamodb-local-tables.sh
      - name: keys
        run: |
          openssl ecparam -genkey -name prime256v1 -noout -out signkey.pem
          openssl ecparam -genkey -noout -name prime256v1 | openssl pkcs8 -topk8 -nocrypt -out encodekey.pem
          openssl ec -in encodekey.pem -pubout -out decodekey.pem
          echo "SIGN_KEY_PATH=$PWD/signkey.pem" >> $GITHUB_ENV
          echo "ENCODING_KEY_PATH=$PWD/encodekey.pem" >> $GITHUB_ENV
          echo "DECODING_KEY_PATH=$PWD/decodekey.pem" >> $GITHUB_ENV
      - run: cargo build
      - name: seed user + mint human/service CWTs
        run: cargo run --bin seed-test-user -- --encoding-key encodekey.pem --issuer http://127.0.0.1:8080 > human.cwt
      # main.rs loads this unconditionally at startup (`?` on the read); it's
      # gitignored (deployment-specific, real Apple app ids), so CI needs a
      # placeholder — content doesn't matter, this test never hits the
      # /.well-known/apple-app-site-association route.
      - run: echo '{}' > apple-app-site-association.json
      - run: (cargo run &) ; for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - run: AUTHNZ_TEST_BASE_URL=http://127.0.0.1:8080 AUTHNZ_TEST_HUMAN_CWT=$(cat human.cwt) AUTHNZ_TEST_SERVICE_CWT=$(cat service.cwt) cargo test --test agent_flow -- --ignored
